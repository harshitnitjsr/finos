name: afos-production
region: nyc1

services:
  - name: backend

    github:
      repo: harshitnitjsr/finos
      branch: main
      deploy_on_push: true

    source_dir: backend
    dockerfile_path: Dockerfile

    http_port: 8000

    instance_count: 1
    instance_size_slug: basic-xs

    routes:
      - path: /

    envs:
      # --- Infrastructure ---
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${DATABASE_URL}

      - key: ASYNC_DATABASE_URL
        scope: RUN_TIME
        value: ${ASYNC_DATABASE_URL}

      - key: REDIS_URL
        scope: RUN_TIME
        value: ${REDIS_URL}

      - key: QDRANT_URL
        scope: RUN_TIME
        value: ${QDRANT_URL}

      - key: QDRANT_API_KEY
        scope: RUN_TIME
        value: ${QDRANT_API_KEY}

      - key: TEMPORAL_HOST
        scope: RUN_TIME
        value: ${TEMPORAL_HOST}

      - key: TEMPORAL_NAMESPACE
        scope: RUN_TIME
        value: ${TEMPORAL_NAMESPACE}

      - key: TEMPORAL_TASK_QUEUE
        scope: RUN_TIME
        value: ${TEMPORAL_TASK_QUEUE}

      - key: OPA_URL
        scope: RUN_TIME
        value: http://background-worker:8181/v1/data/finance

      # --- App Secrets ---
      - key: APP_SECRET_KEY
        scope: RUN_TIME
        value: ${APP_SECRET_KEY}

      - key: BACKEND_API_SECRET
        scope: RUN_TIME
        value: ${BACKEND_API_SECRET}

      - key: APP_BASE_URL
        scope: RUN_TIME
        value: ${APP_BASE_URL}

      - key: NEXTJS_ORIGIN
        scope: RUN_TIME
        value: ${NEXTJS_ORIGIN}

      # --- Settings ---
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production

      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

      - key: STORAGE_TYPE
        scope: RUN_TIME
        value: ${STORAGE_TYPE}

      # --- AI Models ---
      - key: DO_INFERENCE_API_KEY
        scope: RUN_TIME
        value: ${DO_INFERENCE_API_KEY}

      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}

      - key: MODEL_ROUTER_REASONING
        scope: RUN_TIME
        value: ${MODEL_ROUTER_REASONING}

      - key: MODEL_ROUTER_EXTRACTION
        scope: RUN_TIME
        value: ${MODEL_ROUTER_EXTRACTION}

      - key: MODEL_ROUTER_CLASSIFICATION
        scope: RUN_TIME
        value: ${MODEL_ROUTER_CLASSIFICATION}

      - key: MODEL_ROUTER_EMBEDDING
        scope: RUN_TIME
        value: ${MODEL_ROUTER_EMBEDDING}

      - key: MODEL_ROUTER_FORECAST
        scope: RUN_TIME
        value: ${MODEL_ROUTER_FORECAST}

      - key: MODEL_ROUTER_COMPLIANCE
        scope: RUN_TIME
        value: ${MODEL_ROUTER_COMPLIANCE}

      # --- Razorpay ---
      - key: RAZORPAY_KEY_ID
        scope: RUN_TIME
        value: ${RAZORPAY_KEY_ID}

      - key: RAZORPAY_KEY_SECRET
        scope: RUN_TIME
        value: ${RAZORPAY_KEY_SECRET}

      - key: RAZORPAYX_ACCOUNT_NUMBER
        scope: RUN_TIME
        value: ${RAZORPAYX_ACCOUNT_NUMBER}

      - key: RAZORPAY_WEBHOOK_SECRET
        scope: RUN_TIME
        value: ${RAZORPAY_WEBHOOK_SECRET}

      - key: RAZORPAY_PLAN_ID_STARTER
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_STARTER}

      - key: RAZORPAY_PLAN_ID_PRO
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_PRO}

      - key: RAZORPAY_PLAN_ID_ENTERPRISE
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_ENTERPRISE}

      - key: RAZORPAY_PLAN_ID_STARTER_USD
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_STARTER_USD}

      - key: RAZORPAY_PLAN_ID_PRO_USD
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_PRO_USD}

      - key: RAZORPAY_PLAN_ID_ENTERPRISE_USD
        scope: RUN_TIME
        value: ${RAZORPAY_PLAN_ID_ENTERPRISE_USD}

      # --- Stripe ---
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        value: ${STRIPE_SECRET_KEY}

      - key: STRIPE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: ${STRIPE_PUBLISHABLE_KEY}

      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        value: ${STRIPE_WEBHOOK_SECRET}

      # --- SMTP ---
      - key: SMTP_SERVER
        scope: RUN_TIME
        value: ${SMTP_SERVER}

      - key: SMTP_PORT
        scope: RUN_TIME
        value: ${SMTP_PORT}

      - key: SMTP_USERNAME
        scope: RUN_TIME
        value: ${SMTP_USERNAME}

      - key: SMTP_PASSWORD
        scope: RUN_TIME
        value: ${SMTP_PASSWORD}

      - key: SMTP_FROM_EMAIL
        scope: RUN_TIME
        value: ${SMTP_FROM_EMAIL}

      # --- AWS ---
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        value: ${AWS_ACCESS_KEY_ID}

      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        value: ${AWS_SECRET_ACCESS_KEY}

      - key: AWS_REGION
        scope: RUN_TIME
        value: ${AWS_REGION}

      # --- Business ---
      - key: PLATFORM_COMMISSION_PERCENT
        scope: RUN_TIME
        value: ${PLATFORM_COMMISSION_PERCENT}

  - name: background-worker
    github:
      repo: harshitnitjsr/finos
      branch: main
      deploy_on_push: true

    source_dir: backend
    dockerfile_path: Dockerfile

    internal_ports:
      - 8181

    run_command: sh start_workers.sh

    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${DATABASE_URL}

      - key: ASYNC_DATABASE_URL
        scope: RUN_TIME
        value: ${ASYNC_DATABASE_URL}

      - key: REDIS_URL
        scope: RUN_TIME
        value: ${REDIS_URL}

      - key: QDRANT_URL
        scope: RUN_TIME
        value: ${QDRANT_URL}

      - key: QDRANT_API_KEY
        scope: RUN_TIME
        value: ${QDRANT_API_KEY}

      - key: TEMPORAL_HOST
        scope: RUN_TIME
        value: ${TEMPORAL_HOST}

      - key: TEMPORAL_NAMESPACE
        scope: RUN_TIME
        value: ${TEMPORAL_NAMESPACE}

      - key: TEMPORAL_TASK_QUEUE
        scope: RUN_TIME
        value: ${TEMPORAL_TASK_QUEUE}

      - key: OPA_URL
        scope: RUN_TIME
        value: http://localhost:8181/v1/data/finance

      - key: APP_SECRET_KEY
        scope: RUN_TIME
        value: ${APP_SECRET_KEY}

      - key: BACKEND_API_SECRET
        scope: RUN_TIME
        value: ${BACKEND_API_SECRET}

      - key: DO_INFERENCE_API_KEY
        scope: RUN_TIME
        value: ${DO_INFERENCE_API_KEY}

      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}