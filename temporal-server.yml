version: '3.8'

services:
  temporal-server:
    image: temporalio/auto-setup:1.24.0
    container_name: temporal-server

    environment:
      - DB=postgres12

      - POSTGRES_SEEDS=$EXTERNAL_DB_HOST
      - DB_PORT=5432

      - POSTGRES_USER=$EXTERNAL_DB_USER
      - POSTGRES_PWD=$EXTERNAL_DB_PASSWORD

      - POSTGRES_TLS_ENABLED=true
      - SQL_TLS_ENABLED=true

      - SQL_DATABASE=temporal
      - SQL_VISIBILITY_DATABASE=temporal_visibility

      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development_sql.yaml

    ports:
      - "7233:7233"

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui

    depends_on:
      - temporal-server

    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233

    ports:
      - "8080:8080"
