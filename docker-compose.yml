# ─────────────────────────────────────────────────────────────────────────────
# AFOS — Cloud-Connected Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# This configuration assumes you are using external cloud services:
# - PostgreSQL (Neon/Supabase)
# - Redis (Upstash)
# 
# It only runs the logic (Backend) and secondary services (Qdrant, OPA).
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afos_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Note: depends_on is removed as we depend on external cloud DBs
    volumes:
      - ./backend/uploads:/app/uploads

  opa:
    image: openpolicyagent/opa:latest
    container_name: afos_opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      - "--watch"
      - "/policies"
    volumes:
      - ./backend/policies:/policies

  # UI tools for remote debugging
  adminer:
    image: adminer:latest
    container_name: afos_adminer
    ports:
      - "8082:8080"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: afos_redis_commander
    ports:
      - "8081:8081"
